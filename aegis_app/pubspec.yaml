name: aegis_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.3
  integration_test:
    sdk: flutter
  path_provider: ^2.1.5
  flutter_windowmanager_plus: ^1.1.0
  mobile_scanner: ^6.0.11
  file_picker: ^11.0.3
  cryptography: ^2.9.0
  shared_preferences: ^2.5.3
  flutter_localizations:
    sdk: flutter
  permission_handler: 11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/bin/snowflake-client

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

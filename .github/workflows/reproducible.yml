name: Reproducible Build & Verification BRAVO
on: [push, pull_request]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies & Kani Verifier
        run: |
          apt-get update && apt-get install -y wget unzip python3 python3-pip gcc g++
          cargo install --locked kani-verifier
          cargo kani setup

      - name: Execute Kani Formal Verification
        run: |
          cd aegis-core
          cargo kani --output-format json > kani-report.json || true

      - name: Upload Kani Proof Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kani-formal-proof-report
          path: aegis-core/kani-report.json

      - name: Install Android NDK & Set Linker
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          NDK_PATH=$PWD/android-ndk-r27
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" >> $GITHUB_ENV
          echo "PATH=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH" >> $GITHUB_ENV

      - name: Build Deterministic ARM64 Binary
        run: |
          rustup target add aarch64-linux-android
          cd aegis-core
          cargo build --target aarch64-linux-android --release

      - name: Verify Cryptographic Hash
        run: |
          sha256sum aegis-core/target/aarch64-linux-android/release/libaegis_core.so

name: Reproducible Build & Verification
on: [push, pull_request]

jobs:
  # ============================================================
  # JOB 1 — Kani (pin rust:1.93 pour compatibilité Kani 0.67.0)
  # ============================================================
  kani-proofs:
    name: Formal Proofs (AWS Kani)
    runs-on: ubuntu-latest
    container:
      image: rust:1.93-bookworm     # PIN compatible Kani 0.67.0
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies & Kani
        run: |
          apt-get update && apt-get install -y build-essential python3 python3-pip
          cargo install --locked kani-verifier --version 0.67.0
          cargo kani setup
      - name: Execute Kani Formal Verification
        run: |
          cd aegis-core
          cargo kani --harness crypto_pq::verify_process_512b_frame_bounds > kani-report.txt

  # ============================================================
  # JOB 2 — Miri (idem, pin rust:1.93 pour stabilité)
  # ============================================================
  miri-audit:
    name: Memory Audit (Miri)
    runs-on: ubuntu-latest
    container:
      image: rust:1.93-bookworm     # PIN compatible Miri stable
    strategy:
      fail-fast: false
      matrix:
        # Lancement de 5 serveurs parallèles pour couvrir 100% du code sans timeout
        modules:
          - "crypto crypto_pq"
          - "network mesh transport"
          - "secure_buffer storage session"
          - "keystore stegano ffi_security"
          - "panic hardware_triggers ingestion qr_pairing seccomp signals viewer deadman"
    steps:
      - uses: actions/checkout@v4
      - name: Install Miri
        run: rustup toolchain install nightly-2026-09-01 --component miri
      - name: Execute Miri Undefined Behavior Check
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: |
          cd aegis-core
          # Exécute Miri sur les modules assignés à ce serveur spécifique
          for mod in ${{ matrix.modules }}; do
            cargo +nightly-2026-09-01 miri test $mod --release
          done

  # ============================================================
  # JOB 3 — Build Android (NE PAS TOUCHER = rust:latest = 1.98.1)
  # Même version que le cargo local de l'opérateur = reproducible build
  # ============================================================
  build-android:
    name: Android NDK Build
    runs-on: ubuntu-latest
    container:
      image: rust:latest            # INTACT : 1.98.1 = même que cargo local
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: apt-get update && apt-get install -y wget unzip
      - name: Install Android NDK & Configure Toolchain
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          rustup target add aarch64-linux-android
      - name: Build Deterministic ARM64 Binary
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk-r27
          CC_aarch64_linux_android: ${{ github.workspace }}/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
          AR_aarch64_linux_android: ${{ github.workspace }}/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ github.workspace }}/android-ndk-r27/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang
        run: |
          cd aegis-core
          cargo build --target aarch64-linux-android --release
      - name: Verify Cryptographic Hash
        run: |
          sha256sum aegis-core/target/aarch64-linux-android/release/libaegis_core.so
      # ──────────────────────────────────────────────────────────
      # C65 FIX (2026-10-13) — Upload du .so pour le job suivant
      # (jni-symbols-verification).
      # ──────────────────────────────────────────────────────────
      - name: Upload arm64 .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libaegis_core-arm64-v8a
          path: aegis-core/target/aarch64-linux-android/release/libaegis_core.so
          if-no-files-found: error
          retention-days: 7

  # ============================================================
  # JOB 3bis — Vérification des symboles JNI (C64/C65)
  # ============================================================
  # Contexte :
  #   Le 13/10/2026, un audit a révélé que 6 FFI appelées depuis
  #   Kotlin (external fun) étaient déclarées sans préfixe JNI
  #   (`Java_com_example_...`). Elles compilaient mais craschaient
  #   au runtime avec UnsatisfiedLinkError.
  #
  #   Ce job vérifie, APRÈS le build, que TOUS les symboles JNI
  #   attendus par le code Kotlin sont présents dans le .so.
  #   Il échoue si un seul manque.
  # ============================================================
  jni-symbols-verification:
    name: JNI Symbol Verification
    runs-on: ubuntu-latest
    needs: build-android
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 .so artifact
        uses: actions/download-artifact@v4
        with:
          name: libaegis_core-arm64-v8a
          path: /tmp/aegis-so/

      - name: List .so files
        run: ls -la /tmp/aegis-so/

      - name: Verify JNI symbols present
        run: |
          SO=$(find /tmp/aegis-so -name "libaegis_core.so" | head -n1)
          if [ -z "$SO" ]; then
            echo "ERROR: libaegis_core.so introuvable dans /tmp/aegis-so/"
            exit 1
          fi
          echo "Checking $SO"
          SYMBOLS=$(nm -D --defined-only "$SO")

          MISSING=0
          for SYM in \
            "Java_com_example_aegis_1app_MainActivity_aegisRegisterMainActivity" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1render_1to_1surface" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1release_1surface" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1ingest_1camera_1frame_1direct" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1control_1media_1player" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1derive_1and_1set_1master_1key" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1verify_1attestation_1chain" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1ble_1mesh_1set_1pipes" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1ble_1mesh_1shutdown" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1ble_1mesh_1reader_1start" \
            "Java_com_example_aegis_1app_MainActivity_aegis_1ble_1mesh_1reader_1stop" \
            "Java_com_example_aegis_1app_ProtectedConfirmation_aegisPanicSilentBurn" \
            "Java_com_example_aegis_1app_WifiDirectBridge_aegis_1wifi_1direct_1set_1fd" \
            "Java_com_example_aegis_1app_WifiDirectBridge_aegis_1wifi_1direct_1close_1fd" \
          ; do
            if echo "$SYMBOLS" | grep -q " $SYM$"; then
              echo "✓ $SYM"
            else
              echo "✗ MISSING: $SYM"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING JNI symbol(s) missing"
            exit 1
          fi
          echo "All JNI symbols present."

  # ============================================================
  # JOB 4 — Preuve mmap/mprotect (Valgrind sur Linux natif)
  # Couvre ce que Miri ne peut PAS vérifier : mmap(PROT_NONE) +
  # mprotect(PROT_READ|PROT_WRITE). Valgrind exécute le binaire
  # natif instrumenté et détecte tout accès hors bornes.
  # ============================================================
  linux-mmap-proof:
    name: Linux mmap/mprotect proof (Valgrind)
    runs-on: ubuntu-latest
    container:
      image: rust:1.93-bookworm     # même image que Kani/Miri (cohérence)
    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          apt-get update
          apt-get install -y valgrind

      - name: Build tests (no-run, debug profile)
        run: |
          cd aegis-core
          cargo test --lib polymorphic --no-run

      - name: Execute Valgrind on polymorphic_ram
        run: |
          cd aegis-core
          # Localiser le binaire de test le plus récent
          BIN=$(find target/debug/deps -maxdepth 1 -type f -executable -name 'aegis_core-*' | head -n 1)
          if [ -z "$BIN" ]; then
            echo "ERREUR: binaire de test introuvable"
            exit 1
          fi
          echo "Test binary: $BIN"

          # Lancer Valgrind : échec CI si accès hors bornes détecté
          valgrind \
            --error-exitcode=1 \
            --leak-check=full \
            --show-leak-kinds=definite \
            --track-origins=yes \
            --errors-for-leak-kinds=definite \
            "$BIN" polymorphic --test-threads=1

  # ============================================================
  # JOB 5 — Preuve TPM : compilation de tpm.rs avec la feature `tpm`
  # Ce job est la PREUVE que le module TPM est compilable et testable
  # (mock uniquement — les tests hardware sont `#[ignore]`).
  # Sans ce job, tpm.rs n'est jamais validé par la CI (absent de Miri
  # car #![cfg(not(miri))], absent d'Android car target_os != linux).
  # ============================================================
  tpm-feature-proof:
    name: TPM feature compilation proof
    runs-on: ubuntu-latest
    container:
      image: rust:1.93-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install libtss2 (TPM2-TSS)
        run: |
          apt-get update
          apt-get install -y libtss2-dev pkg-config

      - name: Compile aegis-core with tpm feature
        run: |
          cd aegis-core
          cargo check --features tpm --tests

      - name: Run TPM mock tests (hardware tests ignored)
        run: |
          cd aegis-core
          cargo test --features tpm --lib tpm:: -- --test-threads=1
name: Reproducible Build & Verification
on: [push, pull_request]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    container:
      image: rust:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies & Kani
        run: |
          apt-get update && apt-get install -y build-essential pkg-config libssl-dev python3 python3-pip
          cargo install kani-verifier
          cargo kani setup

      - name: Execute Kani Formal Verification
        run: |
          cd aegis-core
          cargo kani --harness crypto_pq::verify_process_512b_frame_bounds > kani-report.txt

      - name: Execute Miri Undefined Behavior Check
        run: |
          rustup toolchain install nightly --component miri
          cd aegis-core
          cargo +nightly miri test --lib crypto_pq -- --exact crypto_pq::tests::test_aes_256_gcm_neon_roundtrip

      - name: Install Android NDK & Configure Toolchain
        run: |
          apt-get install -y wget unzip
          wget -q https://dl.google.com/android/repository/android-ndk-r27-linux.zip
          unzip -q android-ndk-r27-linux.zip
          rustup target add aarch64-linux-android

      - name: Build Deterministic ARM64 Binary
        run: |
          cd aegis-core
          cargo build --target aarch64-linux-android --release

      - name: Verify Cryptographic Hash
        run: |
          sha256sum aegis-core/target/aarch64-linux-android/release/libaegis_core.so


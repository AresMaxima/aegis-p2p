[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
zeroize = { version = "1.7", features = ["alloc", "derive"] }
getrandom = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
sha2 = { version = "0.10", features = ["force-soft"] }
hkdf = "0.12"
hmac = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"

# --- Post-Quantique Pur Rust Certifie NIST (FIPS 203 ML-KEM & FIPS 204 ML-DSA) ---
fips203 = "0.5"
fips204 = "0.5"

bip39 = "2.0"
hex = "0.4"
rand = "0.8"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

jni = "0.21"
libc = "0.2"
signal-hook = "0.3"
ffi-support = "0.4"
tempfile = "3.8"

# --- Reseau asynchrone, P2P, Tor embarque (Arti 0.48 + static-sqlite interne) ---
tokio = { version = "1.35", features = ["full"] }
arti-client = { version = "0.48", default-features = false, features = ["tokio", "rustls", "onion-service-client", "static-sqlite"] }
tor-rtcompat = { version = "0.48", default-features = false, features = ["tokio", "rustls"] }
subtle = "2.6.1"
lazy_static = "1.5.0"
futures = "0.3.34"

x509-parser = "0.16"
ring = "0.17"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
tss-esapi = { version = "7.3", optional = true }

[profile.release]
opt-level = "z"
lto = false
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.image]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.png]
opt-level = 3

[dev-dependencies]
proptest = "1.4"
rusty-fork = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
default = ["software_alpha_shields"]
software_alpha_shields = []
tpm = ["dep:tss-esapi"]
b2g_phase9_soc = ["efuse_access", "hw_zeroization_mesh"]
efuse_access = []
hw_zeroization_mesh = []
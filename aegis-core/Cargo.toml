[package]
name = "aegis-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# Sécurité Mémoire & Cryptographie Classique & Post-Quantique
zeroize = { version = "1.7", features = ["alloc", "derive"] }
getrandom = "0.2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = "2.1"
pqcrypto-kyber = "0.8"
pqcrypto-traits = "0.3"
bip39 = "2.0"
hex = "0.4"
rand = "0.8"
thiserror = "1.0"

# Hardening Système, Stockage BDD, Signaux OS & FFI
libc = "0.2"
signal-hook = "0.3"
ffi-support = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tempfile = "3.8"

# Réseau Asynchrone, P2P & Tor Embarqué (100% Rustls - Zero OpenSSL)
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.53", default-features = false, features = ["tcp", "noise", "yamux", "tokio", "mdns", "kad", "macros"] }
arti-client = { version = "0.18", default-features = false, features = ["tokio", "rustls"] }
tor-rtcompat = { version = "0.18", default-features = false, features = ["tokio", "rustls"] }
subtle = "2.6.1"
lazy_static = "1.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Memory"] }

[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.3"

# Profil de compilation Release - Durcissement Anti-Forensics & Réduction d'Empreinte
[profile.release]
opt-level = "z"     # Optimise la taille globale du binaire natif (.so / .dll)
lto = true          # Link-Time Optimization : élimine le code mort et fusionne les dépendances
codegen-units = 1   # Minimise les unités de génération pour des optimisations maximales
panic = "abort"     # Supprime le mécanisme de déroulement d'erreurs (stack unwinding)
strip = true        # Efface la totalité des symboles et tables de débogage du binaire